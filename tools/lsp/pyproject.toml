[project]
name = "gandora-lsp"
version = "0.1.0"
description = "gan-lsp — the Gandora language server, written in Gandora (GEP-0015)"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["gandora-core>=0.1.0", "gandora-std>=0.1.0"]

[project.scripts]
gan-lsp = "gandora_lsp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
include = ["pkg", "src", "gandora.jsonc"]

[tool.hatch.build.targets.wheel]
packages = ["pkg/gandora_lsp"]

[tool.uv.sources]
gandora-core = { path = "../../target/wheels/gandora_core-0.1.0-cp39-abi3-manylinux_2_34_x86_64.whl" }
