[project]
name = "gandora-lsp"
version = "0.2.2"
description = "gan-lsp — the Gandora language server, written in Gandora (GEP-0015)"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["gandora-core>=0.2.0", "gandora-std>=0.2.0", "pygls>=2"]

[project.scripts]
gan-lsp = "gandora_lsp.main:main"
gan-lsc = "gandora_lsp.lsc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
include = ["pkg", "src", "gandora.jsonc"]

[tool.hatch.build.targets.wheel]
packages = ["pkg/gandora_lsp"]

[tool.uv.sources]
gandora-core = { path = "../../crates/core-py" }
gandora-std = { path = "../../std" }
