[project]
name = "gandora-lsp"
version = "0.16.0"
description = "gan-lsp — the Gandora language server, written in Gandora (GEP-0015)"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["gandora-core>=0.4.2", "gandora-std>=0.2.0", "gandora-tool>=0.4.1", "pygls>=2", "jedi>=0.19"]

[project.scripts]
gan-lsp = "gandora_lsp.main:main"
gan-lsc = "gandora_lsp.lsc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
include = ["pkg", "src", "gandora.jsonc"]

[tool.hatch.build.targets.wheel]
packages = ["pkg/gandora_lsp"]

[tool.uv.sources]
gandora-tool = { path = "../gan" }
gandora-core = { path = "../../crates/core-py" }
gandora-std = { path = "../../std" }

[dependency-groups]
dev = [
    "pytest>=8",
]
