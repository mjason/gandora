version = 1
revision = 3
requires-python = ">=3.11"

[[package]]
name = "gandora-core"
version = "0.2.1"
source = { directory = "../../crates/core-py" }

[[package]]
name = "gandora-std"
version = "0.2.1"
source = { directory = "../../std" }

[[package]]
name = "gandora-tool"
version = "0.2.1"
source = { editable = "." }
dependencies = [
    { name = "gandora-core" },
    { name = "gandora-std" },
]

[package.metadata]
requires-dist = [
    { name = "gandora-core", directory = "../../crates/core-py" },
    { name = "gandora-std", directory = "../../std" },
]
