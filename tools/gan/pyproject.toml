[project]
name = "gandora-tool"
version = "0.20.0"
description = "gan — the Gandora task runner (mix/cargo role), written in Gandora"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["gandora-core>=0.20.0", "gandora-std>=0.20.0", "gandora-lang>=0.20.0", "ty>=0.0.60"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gan = "gandora_tool.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
include = ["pkg", "src", "gandora.jsonc"]

[tool.hatch.build.targets.wheel]
packages = ["pkg/gandora_tool"]

# local development until gandora-core reaches PyPI (uv.sources does not
# affect the published wheel's metadata); gandora-lang rides along so
# the ganc that `gan test` delegates to tracks the workspace compiler
[tool.uv.sources]
gandora-core = { path = "../../crates/core-py" }
gandora-std = { path = "../../std" }
gandora-lang = { path = "../.." }

[dependency-groups]
dev = [
    "pytest>=8",
]
