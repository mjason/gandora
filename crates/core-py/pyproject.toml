[project]
name = "gandora-core"
version = "0.20.1"
description = "The Gandora compiler as a Python extension module (GEP-0012)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"

[project.urls]
Repository = "https://github.com/mjason/gandora"

[tool.maturin]
module-name = "gandora_core"
include = [{ path = "gandora_core.pyi", format = ["sdist", "wheel"] }]

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

# a path-dependency build must go stale when the compiler sources do —
# without these keys uv reuses a cached wheel across Rust changes
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../core/Cargo.toml" },
    { file = "../core/src/**/*.rs" },
]
