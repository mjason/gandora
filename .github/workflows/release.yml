name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # gandora-lang: the native gan compiler (maturin bin wheel + sdist)
  build-lang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist-lang
          manylinux: auto
      # sdist omitted: maturin sdist of a workspace bin crate carries local
      # path deps PyPI rejects; the wheel is the distribution (binary tool)
      - uses: actions/upload-artifact@v4
        with:
          name: dist-lang
          path: dist-lang

  # gandora-core: the compiler as a Python extension (GEP-0012)
  build-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist-core --manifest-path crates/core-py/Cargo.toml
          manylinux: auto
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist-core --manifest-path crates/core-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: dist-core
          path: dist-core

  # gandora-std: the standard library, compiled by the gan we just built
  build-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - run: cargo build --release
      - name: compile and doctest the stdlib with gan itself
        run: |
          cd std
          ../target/release/ganc build
          ../target/release/ganc test
      - run: cd std && uv build --out-dir ../dist-std
      - uses: actions/upload-artifact@v4
        with:
          name: dist-std
          path: dist-std

  # gandora-tool: the gan task runner, written in Gandora (GEP-0013)
  build-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - run: cargo build --release
      - name: compile the runner with ganc, then package
        run: |
          cd tools/gan
          uv sync
          ../../target/release/ganc build
          uv build --out-dir ../../dist-tool
      - name: compile gan-lsp with ganc, then package
        run: |
          cd tools/lsp
          uv sync
          ../../target/release/ganc build
          uv sync --reinstall-package gandora-lsp
          python tests/lsp_conformance.py .venv/bin/gan-lsp
          uv build --out-dir ../../dist-lsp
      - uses: actions/upload-artifact@v4
        with:
          name: dist-lsp
          path: dist-lsp
      - uses: actions/upload-artifact@v4
        with:
          name: dist-tool
          path: dist-tool

  # Trusted Publishing (OIDC): no tokens anywhere.
  # PyPI side: two pending publishers — gandora-lang uses environment
  # `pypi`, gandora-std uses `pypi-std` (PyPI requires the repo/workflow/
  # environment tuple to be unique per project).
  publish-lang:
    needs: [build-lang]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-lang
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-core:
    needs: [build-core]
    runs-on: ubuntu-latest
    environment: pypi-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-core
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-tool:
    needs: [build-tool]
    runs-on: ubuntu-latest
    environment: pypi-tool
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-tool
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-lsp:
    needs: [build-tool]
    runs-on: ubuntu-latest
    environment: pypi-lsp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-lsp
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-std:
    needs: [build-std]
    runs-on: ubuntu-latest
    environment: pypi-std
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-std
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
