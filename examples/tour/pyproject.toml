[project]
name = "gandora-tour"
version = "0.1.0"
description = "A tour of the Gandora language"
requires-python = ">=3.12"
dependencies = []

# Third-party packages are ordinary uv dependencies; the compiler never
# reads them. `uv sync` puts pandas in .venv and `gan run` picks it up.
[dependency-groups]
dev = ["pandas>=2.0"]
