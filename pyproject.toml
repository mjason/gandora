[project]
name = "gandora-lang"
version = "0.20.0"
description = "The gan compiler: an Elixir-flavored language that compiles to Python"
readme = "README.md"
license = "MIT"
authors = [
    { name = "MJ", email = "tywf91@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/mjason/gandora"
Repository = "https://github.com/mjason/gandora"
Issues = "https://github.com/mjason/gandora/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/gan/Cargo.toml"

# the compiler sources live under crates/, not a root src/ — cache
# keys must watch what the wheel is actually built from, or a path
# install serves a stale ganc (the v0.19.0 core-py lesson, again)
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/core/Cargo.toml" },
    { file = "crates/core/src/**/*.rs" },
    { file = "crates/gan/Cargo.toml" },
    { file = "crates/gan/src/**/*.rs" },
]

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"
